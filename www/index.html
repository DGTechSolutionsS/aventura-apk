<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Aventura com Jesus</title>
<meta name="description" content="Histórias bíblicas, meditações, orações e afirmações para crianças crescerem na fé." />
<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1426" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Aventura com Jesus" />
<link rel="apple-touch-icon" href="assets/img/logos/app_icon_180.png" />
<link rel="icon" type="image/png" href="assets/img/logos/app_icon_192.png" />
<link rel="stylesheet" href="app.css?v=159" />
<script src="lottie.min.js?v=159"></script>
<!-- SEM gravação de sessão. Smartlook e Microsoft Clarity foram REMOVIDOS: o Programa Famílias
     do Google Play proíbe SDK de replay/gravação de tela em app para crianças. A métrica que
     sobrou é agregada e anônima (ANALYTICS_URL, backend próprio) — sem replay, sem vídeo. -->
<script>
  // domínio onde o /api está deployado (funil). Ex: "https://aventuracomjesus.com".
  // O login registra o usuário em API_BASE + "/api/register". Vazio = login funciona local, só não envia pro banco.
  window.API_BASE = "https://aventuracomjesus.com";
  // backend do APP (Railway) — dados do usuário (progresso, economia, streak): SINCRONIZA + PERSISTE.
  // localStorage continua como cache/fallback (o app NUNCA cai por causa disso). Tudo best-effort.
  // KILL-SWITCH: deixe "" pra DESLIGAR o sync na hora (app volta 100% pro localStorage).
  window.APP_API = "https://backendtheo-production.up.railway.app/v1";
  // métrica AGREGADA do app: track() manda os eventos (navegou, abriu_conteudo, viu_assinatura,
  // clicou_assinar, notif_open...) pra cá; o painel BI lê em /api/app-event (x-admin-pass).
  window.ANALYTICS_URL = window.API_BASE + "/api/app-event";
  // ÁUDIO STREAMADO (mantém o APK leve — as narrações NÃO vão dentro do app).
  // Vazio = usa os arquivos locais (assets/audio/) — modo offline/dev.
  window.AUDIO_BASE = "https://apk-download-dgtechsotutionss-projects.vercel.app/audio/";
  window.AUDIO_VER = "1";   // alavanca de cache-bust: só bumpar se algum áudio JÁ publicado for trocado
  // DESENHOS DO COLORIR. Vazio = assets/colorir/ dentro do próprio bundle.
  // No APK isto tem que ficar VAZIO: é o que mantém a criança pintando SEM SINAL.
  // Diferente do áudio, que é streamado de propósito pra não engordar o APK, os
  // desenhos são leves (~2,2 MB nos 6 álbuns) e valem mais offline do que como
  // espaço economizado. Reavaliar lá pelo 5º/6º álbum, quando passar de alguns MB.
  window.COLORIR_BASE = "";
  // PLAY / ANTI-STEERING: o app NÃO pode levar a um pagamento fora da Play Store.
  // STRIPE_CHECKOUT_URL foi zerado de propósito — com "" nenhum código abre checkout externo.
  window.STRIPE_CHECKOUT_URL = "";
</script>
</head>
<body>

<!-- splash inicial (logo Aventura com Jesus), some após carregar -->
<div id="splash">
  <img id="splash-logo" src="assets/img/logos/logo_aventura_branco.webp" alt="Aventura com Jesus" />
</div>

<div id="app">
  <!-- header global (preenchido por JS, oculto em algumas telas) -->
  <header class="hdr" id="hdr"></header>

  <!-- tela ativa (renderizada por JS) -->
  <div class="screen" id="screen"></div>

  <!-- camada de overlays (fluxo de conteúdo, player, etc.) -->
  <div id="overlay"></div>

  <!-- mini-player global -->
  <div class="mini" id="mini">
    <div class="cv" id="mini-cv">🎵</div>
    <div class="ti" id="mini-ti">—</div>
    <button class="pp" id="mini-pp" aria-label="Reproduzir ou pausar"><img src="assets/img/ic_music_pause.webp" class="icoB" alt=""></button>
    <button class="up" id="mini-up" aria-label="Abrir player">⌃</button>
  </div>

  <!-- tab bar -->
  <nav class="tabbar" id="tabbar"></nav>

  <div class="toast" id="toast"></div>
</div>

<!-- áudio de fundo do player -->
<audio id="bg-audio" src="assets/sound/background.mp3" loop preload="none"></audio>

<script src="data.js?v=159"></script>
<script src="app.js?v=159"></script>
<script defer src="colorir.js?v=159"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
